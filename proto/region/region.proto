syntax = "proto3";

import "region/cell.proto";
import "geometry/surface_shape.proto";

package hs.proto.region;

message Surface {
  repeated Cell cells = 1;
  hs.proto.geometry.SurfaceShape shape = 2;
}

message Region {
  string id = 1;
  Surface surface = 2;
  string city_id = 3;
  int32 unique_id_counter = 4;
  string scope_id = 5;
}
